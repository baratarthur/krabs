apiVersion: apps/v1
kind: Deployment
metadata:
  name: latency-check-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: latency-check
  template:
    metadata:
      labels:
        app: latency-check
    spec:
      serviceAccountName: latency-check-sa
      containers:
      - name: webservice
        image: my.private-registry.lan:5000/latency-check-webservice:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5003
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

---
apiVersion: v1
kind: Service
metadata:
  name: latency-check-service
spec:
  type: NodePort
  selector:
    app: latency-check
  ports:
  - protocol: TCP
    port: 5003
    targetPort: 5003
    nodePort: 30003