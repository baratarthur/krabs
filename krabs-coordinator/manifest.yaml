apiVersion: apps/v1
kind: Deployment
metadata:
  name: krabs-coordinator-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: krabs-coordinator
  template:
    metadata:
      labels:
        app: krabs-coordinator
    spec:
      serviceAccountName: cronojobs-manager-sa
      automountServiceAccountToken: true
      containers:
      - name: webservice
        image: my.private-registry.lan:5000/krabs-coordinator:latest
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
          - >-
            echo "Aguardando DB..." &&
            sleep 10 &&
            echo "Rodando Migrations..." &&
            alembic upgrade head &&
            echo "Iniciando App..." &&
            python -m flask run --host=0.0.0.0 --port=5002
        ports:
        - containerPort: 5002
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD
          - name: DB_HOST
            value: "postgres-svc" # Nome do Service criado acima
          - name: DB_NAME
            value: "krabs"

          # Se sua aplicação espera uma string completa (Connection String):
          # postgresql://krabs_user:minha-senha-super-secreta@postgres-svc:5432/krabs_db
          - name: DATABASE_URL 
            value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)"

---
apiVersion: v1
kind: Service
metadata:
  name: krabs-service
spec:
  type: NodePort
  selector:
    app: krabs-coordinator
  ports:
  - protocol: TCP
    port: 5002
    targetPort: 5002
    nodePort: 30002