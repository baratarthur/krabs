apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-creator-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-creator
  template:
    metadata:
      labels:
        app: pod-creator
    spec:
      serviceAccountName: pod-creator-sa
      containers:
      - name: webservice
        image: my.private-registry.lan:5000/pod-creator-webservice:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        ports:
        - containerPort: 5001

---
apiVersion: v1
kind: Service
metadata:
  name: pod-creator-service
spec:
  type: NodePort
  selector:
    app: pod-creator
  ports:
  - protocol: TCP
    port: 5001
    targetPort: 5001
    nodePort: 30001